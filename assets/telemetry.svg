<svg width="860" height="92" viewBox="0 0 860 92" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="telemetryTopLine" x1="0" y1="0" x2="860" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1f1f1f" />
      <stop offset="50%" stop-color="#333333" />
      <stop offset="100%" stop-color="#1f1f1f" />
    </linearGradient>
  </defs>

  <!-- Pure OLED Black Container -->
  <rect x="0.5" y="0.5" width="859" height="91" rx="6" fill="#000000" stroke="#171717" stroke-width="1" />
  <rect x="1" y="1" width="858" height="1" fill="url(#telemetryTopLine)" />

  <!-- Column Dividers -->
  <line x1="215" y1="14" x2="215" y2="78" stroke="#171717" stroke-width="1" />
  <line x1="430" y1="14" x2="430" y2="78" stroke="#171717" stroke-width="1" />
  <line x1="645" y1="14" x2="645" y2="78" stroke="#171717" stroke-width="1" />

  <!-- Column 1: Contributions -->
  <g transform="translate(28, 0)">
    <text x="0" y="44" fill="#f4f4f5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.02em">
      1900+
    </text>
    <text x="0" y="66" fill="#71717a" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="0.05em">
      ANNUAL CONTRIBUTIONS
    </text>
  </g>

  <!-- Column 2: Algorithmic Patterns -->
  <g transform="translate(243, 0)">
    <text x="0" y="44" fill="#f4f4f5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.02em">
      200+
    </text>
    <text x="0" y="66" fill="#71717a" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="0.05em">
      ALGORITHMIC PATTERNS
    </text>
  </g>

  <!-- Column 3: Systems & OS Notes -->
  <g transform="translate(458, 0)">
    <text x="0" y="44" fill="#f4f4f5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.02em">
      190+
    </text>
    <text x="0" y="66" fill="#71717a" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="0.05em">
