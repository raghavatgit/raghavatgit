<svg width="415" height="195" viewBox="0 0 415 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="sBg2" x1="0" y1="0" x2="415" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d111a" />
      <stop offset="100%" stop-color="#141a27" />
    </linearGradient>

    <!-- Top Border Highlight -->
    <linearGradient id="sRim2" x1="0" y1="0" x2="415" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect x="1" y="1" width="413" height="193" rx="10" fill="url(#sBg2)" stroke="#30363d" stroke-width="1" />
  <rect x="1" y="1" width="413" height="2" rx="1" fill="url(#sRim2)" />

  <!-- Top Category and Status -->
  <g transform="translate(20, 16)">
    <rect x="0" y="0" width="130" height="22" rx="5" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
    <circle cx="11" cy="11" r="3" fill="#bc8cff" />
    <text x="20" y="15" fill="#bc8cff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="0.04em">NATIVE DESKTOP</text>

    <!-- Right Protection Pill -->
    <g transform="translate(275, 0)">
      <rect x="0" y="0" width="100" height="22" rx="5" fill="#161b22" stroke="#bc8cff" stroke-width="0.8" />
      <circle cx="11" cy="11" r="3" fill="#bc8cff" />
      <text x="20" y="15" fill="#bc8cff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">WIN32 HOOK</text>
    </g>
  </g>

  <!-- Title -->
  <text x="20" y="66" fill="#f0f6fc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">StreamShield</text>

  <!-- Description -->
  <text x="20" y="90" fill="#8b949e" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400">Lightweight Windows desktop utility isolating sensitive application windows</text>
  <text x="20" y="108" fill="#8b949e" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400">from OBS, Discord, and screen recording pipelines in real time.</text>

  <!-- Clean Visual Metric Pills -->
  <g transform="translate(20, 126)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="55" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
    <text x="10" y="15" fill="#c9d1d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Rust</text>

    <!-- Pill 2 -->
    <g transform="translate(63, 0)">
      <rect x="0" y="0" width="55" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
      <text x="10" y="15" fill="#c9d1d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Tauri</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(126, 0)">
      <rect x="0" y="0" width="85" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
      <text x="10" y="15" fill="#c9d1d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Win32 APIs</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(219, 0)">
      <rect x="0" y="0" width="95" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
      <text x="10" y="15" fill="#c9d1d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Sub-25MB RAM</text>
    </g>
  </g>

  <!-- Bottom CTA Bar -->
  <g transform="translate(20, 160)">
    <text x="0" y="14" fill="#bc8cff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Inspect Architecture ↗</text>
