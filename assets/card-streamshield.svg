<svg width="415" height="190" viewBox="0 0 415 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Obsidian Card Surface -->
    <linearGradient id="ssBg" x1="0" y1="0" x2="415" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08090d" />
      <stop offset="60%" stop-color="#0d111b" />
      <stop offset="100%" stop-color="#111624" />
    </linearGradient>

    <!-- Normal Static Top Accent Line -->
    <linearGradient id="ssRim" x1="0" y1="0" x2="415" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Normal Static Ambient Radial Glow -->
    <radialGradient id="ssAmbientGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(320, 50) rotate(45) scale(180, 120)">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#08090d" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Container Base with Hairline Border -->
  <rect x="1" y="1" width="413" height="188" rx="10" fill="url(#ssBg)" stroke="#222738" stroke-width="1" />

  <!-- Normal Ambient Light -->
  <rect x="2" y="2" width="411" height="186" rx="9" fill="url(#ssAmbientGlow)" />

  <!-- Normal Static Top Rim Accent -->
  <rect x="1" y="1" width="413" height="1.8" rx="1" fill="url(#ssRim)" />

  <!-- Header Category & Live Status -->
  <g transform="translate(20, 16)">
    <rect x="0" y="0" width="130" height="22" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
    <circle cx="11" cy="11" r="3" fill="#818cf8" />
    <text x="20" y="15" fill="#a78bfa" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="0.04em">NATIVE DESKTOP</text>

    <!-- Right Protection Status (Zero Pulsating Dots) -->
    <g transform="translate(275, 0)">
      <rect x="0" y="0" width="100" height="22" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
      <circle cx="11" cy="11" r="3.5" fill="#38bdf8" />
      <text x="20" y="15" fill="#7dd3fc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">WIN32 HOOK</text>
    </g>
  </g>

  <!-- Title -->
  <text x="20" y="64" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">StreamShield</text>

  <!-- Description -->
  <text x="20" y="86" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400">Lightweight Windows desktop utility isolating sensitive application windows</text>
  <text x="20" y="104" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400">from OBS, Discord, and screen recording pipelines in real time.</text>

  <!-- Clean Shield Icon Graphic -->
  <g transform="translate(330, 56)">
    <path d="M16 2 L30 8 L30 20 C30 28 16 36 16 36 C16 36 2 28 2 20 L2 8 Z" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" stroke-linejoin="round" />
    <path d="M11 18 L15 22 L22 14" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Tech Metric Pills -->
  <g transform="translate(20, 122)">
    <rect x="0" y="0" width="55" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
    <text x="10" y="15" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Rust</text>

    <g transform="translate(63, 0)">
      <rect x="0" y="0" width="55" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
      <text x="10" y="15" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Tauri</text>
    </g>

    <g transform="translate(126, 0)">
      <rect x="0" y="0" width="85" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
      <text x="10" y="15" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Win32 APIs</text>
    </g>

    <g transform="translate(219, 0)">
      <rect x="0" y="0" width="95" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
      <text x="10" y="15" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Sub-25MB RAM</text>
    </g>
  </g>

  <!-- Bottom CTA Bar with Static Vector Arrow -->
  <g transform="translate(20, 160)">
    <text x="0" y="12" fill="#818cf8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Inspect Architecture</text>
    <path d="M129 4H135M135 4V10M135 4L128 11" stroke="#818cf8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
