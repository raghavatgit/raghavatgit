<svg width="860" height="96" viewBox="0 0 860 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Obsidian Surface -->
    <linearGradient id="fBg" x1="0" y1="0" x2="860" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08090d" />
      <stop offset="50%" stop-color="#0d111b" />
      <stop offset="100%" stop-color="#121726" />
    </linearGradient>

    <!-- Subtle Moving Accent Top Rim -->
    <linearGradient id="fRim" x1="0" y1="0" x2="860" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5e6ad2" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#5e6ad2;#38bdf8;#818cf8;#5e6ad2" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#5e6ad2;#38bdf8" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#818cf8;#5e6ad2;#38bdf8;#818cf8" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <radialGradient id="fAmbientGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(430, 48) rotate(0) scale(380, 70)">
      <stop offset="0%" stop-color="#5e6ad2" stop-opacity="0.12">
        <animate attributeName="stop-opacity" values="0.12;0.04;0.16;0.12" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#08090d" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Container Base with Hairline Border -->
  <rect x="1" y="1" width="858" height="94" rx="10" fill="url(#fBg)" stroke="#22293d" stroke-width="1" />
  <rect x="2" y="2" width="856" height="92" rx="9" fill="url(#fAmbientGlow)" />
  <rect x="1" y="1" width="858" height="1.8" rx="1" fill="url(#fRim)" />

  <!-- Centered Headline & Status -->
  <text x="430" y="42" text-anchor="middle" fill="#f7f8f8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">
    Raghav Goyal · South Asian University '29
  </text>
  <text x="430" y="64" text-anchor="middle" fill="#8a8f98" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500">
    Crafted with clean UI/UX discipline · Open for freelance engineering and contract MVP delivery
  </text>
</svg>
