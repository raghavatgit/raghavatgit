<svg width="860" height="90" viewBox="0 0 860 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="footerBg" x1="0" y1="0" x2="860" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0d16" />
      <stop offset="50%" stop-color="#0f1422" />
      <stop offset="100%" stop-color="#141a2c" />
    </linearGradient>

    <!-- Glowing Top Accent Line -->
    <linearGradient id="footerRim" x1="0" y1="0" x2="860" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect x="1" y="1" width="858" height="88" rx="10" fill="url(#footerBg)" stroke="#30363d" stroke-width="1" />
  <rect x="1" y="1" width="858" height="2" rx="1" fill="url(#footerRim)" />

  <!-- Centered Decorative Text -->
  <text x="430" y="40" text-anchor="middle" fill="#e6edf3" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
    Raghav Goyal · South Asian University '29
  </text>
  <text x="430" y="62" text-anchor="middle" fill="#8b949e" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400">
    Crafted with clean UI/UX discipline · Open for freelance engineering and contract MVP delivery
  </text>
</svg>
