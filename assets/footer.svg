<svg width="860" height="110" viewBox="0 0 860 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="fBg" x1="0" y1="0" x2="860" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="50%" stop-color="#0e1422" />
      <stop offset="100%" stop-color="#141c2e" />
    </linearGradient>

    <!-- Animated Wave Gradient 1 -->
    <linearGradient id="waveGrad1" x1="0" y1="0" x2="860" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.35" />
    </linearGradient>

    <!-- Animated Wave Gradient 2 -->
    <linearGradient id="waveGrad2" x1="0" y1="0" x2="860" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#39d353" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#00f5ff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#39d353" stop-opacity="0.3" />
    </linearGradient>

    <!-- Top Laser Glow Rim -->
    <linearGradient id="fLaser" x1="0" y1="0" x2="860" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#bc8cff;#39d353;#58a6ff" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#bc8cff">
        <animate attributeName="stop-color" values="#bc8cff;#39d353;#58a6ff;#bc8cff" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#39d353">
        <animate attributeName="stop-color" values="#39d353;#58a6ff;#bc8cff;#39d353" dur="5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect x="1" y="1" width="858" height="108" rx="10" fill="url(#fBg)" stroke="#30363d" stroke-width="1" />
  <rect x="1" y="1" width="858" height="2.5" rx="1" fill="url(#fLaser)" />

  <!-- Animated Wave Layer 1 -->
  <path fill="url(#waveGrad1)">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="
        M 0 70 Q 215 50 430 70 T 860 70 L 860 110 L 0 110 Z;
        M 0 70 Q 215 90 430 70 T 860 70 L 860 110 L 0 110 Z;
        M 0 70 Q 215 50 430 70 T 860 70 L 860 110 L 0 110 Z
      " />
  </path>

  <!-- Animated Wave Layer 2 -->
  <path fill="url(#waveGrad2)">
    <animate attributeName="d" dur="4.5s" repeatCount="indefinite"
      values="
        M 0 80 Q 215 95 430 80 T 860 80 L 860 110 L 0 110 Z;
        M 0 80 Q 215 65 430 80 T 860 80 L 860 110 L 0 110 Z;
        M 0 80 Q 215 95 430 80 T 860 80 L 860 110 L 0 110 Z
      " />
  </path>

  <!-- Centered Headline & Status -->
  <text x="430" y="44" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">
    Raghav Goyal · South Asian University '29
  </text>
  <text x="430" y="68" text-anchor="middle" fill="#8b949e" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
    Crafted with clean UI/UX discipline · Open for freelance engineering and contract MVP delivery
  </text>
</svg>
