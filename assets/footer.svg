<svg width="860" height="96" viewBox="0 0 860 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Obsidian Surface -->
    <linearGradient id="fBg" x1="0" y1="0" x2="860" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08090d" />
      <stop offset="60%" stop-color="#0d111b" />
      <stop offset="100%" stop-color="#111624" />
    </linearGradient>

    <!-- Normal Static Top Accent Line -->
    <linearGradient id="fRim" x1="0" y1="0" x2="860" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.9" />
    </linearGradient>

    <!-- Normal Static Ambient Radial Glow -->
    <radialGradient id="fAmbientGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(430, 48) rotate(0) scale(380, 70)">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#08090d" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Container Base with Hairline Border -->
  <rect x="1" y="1" width="858" height="94" rx="10" fill="url(#fBg)" stroke="#222738" stroke-width="1" />
  <rect x="2" y="2" width="856" height="92" rx="9" fill="url(#fAmbientGlow)" />
  <rect x="1" y="1" width="858" height="1.8" rx="1" fill="url(#fRim)" />

  <!-- Centered Headline & Status -->
  <text x="430" y="42" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">
    Raghav Goyal | South Asian University '29
  </text>
  <text x="430" y="64" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500">
    Designed with UI/UX Pro Max engineering principles | Open for freelance and contract MVP delivery
  </text>
</svg>
