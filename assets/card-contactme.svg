<svg width="415" height="195" viewBox="0 0 415 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cBg1" x1="0" y1="0" x2="415" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d111a" />
      <stop offset="100%" stop-color="#141a27" />
    </linearGradient>

    <!-- Top Border Highlight -->
    <linearGradient id="cRim1" x1="0" y1="0" x2="415" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect x="1" y="1" width="413" height="193" rx="10" fill="url(#cBg1)" stroke="#30363d" stroke-width="1" />
  <rect x="1" y="1" width="413" height="2" rx="1" fill="url(#cRim1)" />

  <!-- Top Category and Status -->
  <g transform="translate(20, 16)">
    <rect x="0" y="0" width="125" height="22" rx="5" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
    <circle cx="11" cy="11" r="3" fill="#58a6ff" />
    <text x="20" y="15" fill="#58a6ff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="0.04em">3D SPATIAL WEB</text>

    <!-- Right Live Pill -->
    <g transform="translate(300, 0)">
      <rect x="0" y="0" width="75" height="22" rx="5" fill="#161b22" stroke="#3fb950" stroke-width="0.8" />
      <circle cx="11" cy="11" r="3" fill="#3fb950">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="20" y="15" fill="#3fb950" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">LIVE MVP</text>
    </g>
  </g>

  <!-- Title -->
  <text x="20" y="66" fill="#f0f6fc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">ContactMe</text>

  <!-- Description -->
  <text x="20" y="90" fill="#8b949e" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400">Interactive personal 3D web portal featuring real-time CSS3 matrix</text>
  <text x="20" y="108" fill="#8b949e" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400">perspective transforms driven by cursor velocity and physics.</text>

  <!-- Clean Visual Metric Pills -->
  <g transform="translate(20, 126)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="85" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
    <text x="10" y="15" fill="#c9d1d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">JavaScript</text>

    <!-- Pill 2 -->
    <g transform="translate(93, 0)">
      <rect x="0" y="0" width="105" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
      <text x="10" y="15" fill="#c9d1d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">CSS3 3D Matrix</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(206, 0)">
      <rect x="0" y="0" width="95" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
      <text x="10" y="15" fill="#c9d1d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Pure Browser</text>
    </g>
  </g>

  <!-- Bottom CTA Bar -->
  <g transform="translate(20, 160)">
    <text x="0" y="14" fill="#58a6ff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Launch Interactive Portal ↗</text>
  </g>
</svg>
