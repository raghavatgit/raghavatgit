<svg width="415" height="190" viewBox="0 0 415 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Obsidian Card Surface -->
    <linearGradient id="cmBg" x1="0" y1="0" x2="415" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08090d" />
      <stop offset="60%" stop-color="#0d111b" />
      <stop offset="100%" stop-color="#111624" />
    </linearGradient>

    <!-- Normal Static Top Accent Line -->
    <linearGradient id="cmRim" x1="0" y1="0" x2="415" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Normal Static Ambient Radial Glow -->
    <radialGradient id="cmAmbientGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(320, 50) rotate(45) scale(180, 120)">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#08090d" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Container Base with Hairline Border -->
  <rect x="1" y="1" width="413" height="188" rx="10" fill="url(#cmBg)" stroke="#222738" stroke-width="1" />

  <!-- Normal Ambient Light -->
  <rect x="2" y="2" width="411" height="186" rx="9" fill="url(#cmAmbientGlow)" />

  <!-- Normal Static Top Rim Accent -->
  <rect x="1" y="1" width="413" height="1.8" rx="1" fill="url(#cmRim)" />

  <!-- Header Category & Live Status -->
  <g transform="translate(20, 16)">
    <rect x="0" y="0" width="125" height="22" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
    <circle cx="11" cy="11" r="3" fill="#6366f1" />
    <text x="20" y="15" fill="#818cf8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="0.04em">3D SPATIAL WEB</text>

    <!-- Right Live Status Pill (Zero Pulsating Dots) -->
    <g transform="translate(300, 0)">
      <rect x="0" y="0" width="75" height="22" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
      <circle cx="11" cy="11" r="3.5" fill="#10b981" />
      <text x="20" y="15" fill="#34d399" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">LIVE MVP</text>
    </g>
  </g>

  <!-- Title -->
  <text x="20" y="64" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">ContactMe</text>

  <!-- Description -->
  <text x="20" y="86" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400">Interactive personal 3D web portal featuring real-time CSS3 matrix</text>
  <text x="20" y="104" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400">perspective transforms driven by cursor velocity and physics.</text>

  <!-- Clean Isometric Plane Graphic -->
  <g transform="translate(325, 58)">
    <polygon points="0,18 36,0 64,16 28,34" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="32" cy="16" r="2.5" fill="#6366f1" />
    <line x1="32" y1="16" x2="50" y2="6" stroke="#818cf8" stroke-width="1" stroke-dasharray="2 2" stroke-opacity="0.8" />
  </g>

  <!-- Tech Metric Pills -->
  <g transform="translate(20, 122)">
    <rect x="0" y="0" width="85" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
    <text x="10" y="15" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">JavaScript</text>

    <g transform="translate(93, 0)">
      <rect x="0" y="0" width="105" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
      <text x="10" y="15" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">CSS3 3D Matrix</text>
    </g>

    <g transform="translate(206, 0)">
      <rect x="0" y="0" width="95" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
      <text x="10" y="15" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Sub-1ms RAF</text>
    </g>
  </g>

  <!-- Bottom CTA Bar with Static Vector Arrow -->
  <g transform="translate(20, 160)">
    <text x="0" y="12" fill="#818cf8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Launch Interactive Portal</text>
    <path d="M152 4H158M158 4V10M158 4L151 11" stroke="#818cf8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
