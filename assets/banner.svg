<svg width="860" height="200" viewBox="0 0 860 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Card Background -->
    <linearGradient id="cardBg" x1="0" y1="0" x2="860" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0d16" />
      <stop offset="60%" stop-color="#0f1422" />
      <stop offset="100%" stop-color="#141a2c" />
    </linearGradient>

    <!-- Top Accent Rim Line -->
    <linearGradient id="rimGrad" x1="0" y1="0" x2="860" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0.9" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="nameGrad" x1="32" y1="0" x2="320" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d0d7de" />
    </linearGradient>
  </defs>

  <!-- Base Card Container with Smooth Geometry -->
  <rect x="1" y="1" width="858" height="198" rx="12" fill="url(#cardBg)" stroke="#30363d" stroke-width="1" />

  <!-- Crisp 1.5px Top Accent Glow Bar -->
  <rect x="1" y="1" width="858" height="2.5" rx="1" fill="url(#rimGrad)" />

  <!-- Name Headline -->
  <text x="36" y="52" fill="url(#nameGrad)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.02em">RAGHAV GOYAL</text>

  <!-- Animated Role Text (Smooth 3-Phase Dissolve Loop) -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <!-- Phase 1: Aspiring Software Engineer -->
    <text x="36" y="80" fill="#58a6ff">
      Aspiring Software Engineer
      <animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.27;0.33;0.94;0.98;1" dur="7.5s" repeatCount="indefinite" />
    </text>

    <!-- Phase 2: Full-Stack Web Designer -->
    <text x="36" y="80" fill="#3fb950" opacity="0">
      Freelance Full-Stack Web Designer
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.36;0.60;0.66;1" dur="7.5s" repeatCount="indefinite" />
    </text>

    <!-- Phase 3: Native Desktop App Developer -->
    <text x="36" y="80" fill="#bc8cff" opacity="0">
      Native Desktop Application Developer
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.64;0.69;0.93;0.97;1" dur="7.5s" repeatCount="indefinite" />
    </text>
  </g>

  <!-- Descriptive Core Statement -->
  <text x="36" y="112" fill="#8b949e" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">Crafting responsive web architectures, lightweight native utilities, and high-performance digital experiences.</text>

  <!-- Bottom Badges / Status Bar -->
  <g transform="translate(36, 142)">
    <!-- Freelance Badge with Live Pulsing Radar -->
    <g>
      <rect x="0" y="0" width="176" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <circle cx="15" cy="14" r="5" fill="#3fb950" opacity="0.4">
        <animate attributeName="r" values="3.5;7.5;3.5" dur="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.4;0;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <circle cx="15" cy="14" r="3.5" fill="#3fb950">
        <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="29" y="18" fill="#7ee787" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Available for Freelance</text>
    </g>

    <!-- Domain 1 -->
    <g transform="translate(186, 0)">
      <rect x="0" y="0" width="135" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="14" y="18" fill="#8b949e" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">crag.web.app</text>
    </g>

    <!-- Domain 2 -->
    <g transform="translate(331, 0)">
      <rect x="0" y="0" width="180" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="14" y="18" fill="#8b949e" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">contactraghav.web.app</text>
    </g>

    <!-- Location -->
    <g transform="translate(521, 0)">
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="14" y="18" fill="#8b949e" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">New Delhi, India</text>
    </g>
  </g>
</svg>