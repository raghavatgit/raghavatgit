    <circle cx="12" cy="12" r="3.5" fill="#3fb950" />
    <text x="24" y="16" fill="#7ee787" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">Available for Freelance</text>
