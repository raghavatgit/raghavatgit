<svg width="860" height="220" viewBox="0 0 860 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="860" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#141924" />
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0" y1="0" x2="860" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="#39d353" />
    </linearGradient>
    <pattern id="gridPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#21262d" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Container -->
  <rect x="1" y="1" width="858" height="218" rx="8" fill="url(#bgGrad)" stroke="url(#strokeGrad)" stroke-width="1.5" />
  <rect x="2" y="2" width="856" height="216" rx="7" fill="url(#gridPattern)" />

  <!-- Terminal Top Bar -->
  <circle cx="28" cy="24" r="5" fill="#f85149" />
  <circle cx="44" cy="24" r="5" fill="#e3b341" />
  <circle cx="60" cy="24" r="5" fill="#3fb950" />
  <text x="80" y="28" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500">raghav@portfolio:~ (South Asian University '29)</text>

  <!-- Terminal Command Prompt -->
  <text x="28" y="65" fill="#7ee787" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" font-weight="600">$ raghav --status --freelance</text>

